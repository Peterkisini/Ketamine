<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<title>opium_os</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Pinyon+Script&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#000;--panel:#0b0507;--red:#e0102a;--deep:#5a0a14;--ink:#e9e4e4;--mute:#6b5f61;--line:#2a0a10;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Mono',ui-monospace,Menlo,monospace;font-size:14px}
body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:80px}
/* intro */
#intro{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 2s;cursor:pointer}
#intro.out{opacity:0;pointer-events:none}
#intro h1{font-family:'UnifrakturCook','Old English Text MT',serif;font-weight:700;font-size:25vw;max-width:480px;margin:0;color:var(--red);letter-spacing:.02em;display:flex}
#intro h1 span{opacity:0;filter:blur(14px);text-shadow:0 0 30px var(--red),0 0 80px var(--red);animation:rise 1.8s ease-out forwards}
#intro h1 span:nth-child(1){animation-delay:.4s}#intro h1 span:nth-child(2){animation-delay:1s}#intro h1 span:nth-child(3){animation-delay:1.6s}#intro h1 span:nth-child(4){animation-delay:2.2s}#intro h1 span:nth-child(5){animation-delay:2.8s}
@keyframes rise{to{opacity:1;filter:blur(0);text-shadow:0 0 12px rgba(224,16,42,.8),0 0 50px rgba(224,16,42,.45)}}
#intro p{color:var(--mute);margin-top:18px;opacity:0;animation:fade 1s 3.8s forwards}
@keyframes fade{to{opacity:1}}
#intro h1{animation:glow 2.6s ease-in-out 4.4s infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 6px rgba(224,16,42,.4))}50%{filter:drop-shadow(0 0 24px rgba(224,16,42,.95))}}
header,main,nav{transition:opacity 2s}body:not(.ready) header,body:not(.ready) main,body:not(.ready) nav{opacity:0}
/* header */
header{padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.logos{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;min-height:92px}
.logo{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.l-00{font-family:'UnifrakturCook',serif;font-size:58px;color:#fff;-webkit-text-stroke:1px #fff;opacity:.9}
.l-script{font-family:'Pinyon Script',cursive;font-size:56px;color:#fff}
.l-gothic{font-family:'UnifrakturCook',serif;font-size:22px;color:var(--red);text-shadow:0 0 10px rgba(224,16,42,.5)}
.l-gold{font-family:'UnifrakturCook',serif;font-size:22px;color:#a8873a}
.logos{justify-content:space-between;flex-wrap:nowrap}.l-img img{height:84px;display:block;width:auto;max-width:100%}.l-img.pa img{height:84px}.l-img.an img{height:70px}.l-img.st img{height:84px}
.hrow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--red)}
.hrow b{font-weight:700;letter-spacing:.14em;font-size:15px}
.hrow small{color:var(--mute);font-size:12px}
main{padding:14px 16px}
.view{display:none}.view.on{display:block}
h2{font-weight:400;color:var(--red);font-size:14px;margin:18px 0 8px}
/* calendar */
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mh button{background:none;border:1px solid var(--line);color:var(--red);font:inherit;padding:6px 12px;border-radius:10px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{color:var(--deep);padding:6px 0}
.d{position:relative;aspect-ratio:1/1.15;border:1px solid transparent;border-radius:10px;background:none;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0}
.d.we{color:#9a7f84}
.d.sel{background:#1c060b}
.d.today{border-color:var(--red)}
.d .dots{display:flex;gap:3px;height:5px}
.dot{width:5px;height:5px;border-radius:50%;background:#cfc8c8}
.dot.cat{background:var(--red);box-shadow:0 0 6px var(--red)}
.dot.rt{background:none;border:1px solid var(--deep)}
.legend{color:var(--mute);font-size:12px;margin-top:12px;display:flex;flex-wrap:wrap;gap:4px 14px}
/* lists */
.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.item .t{color:var(--red);min-width:104px;font-size:13px}
.item .n{flex:1}.item .n i{display:block;color:var(--mute);font-style:normal;font-size:12px}
.chk{appearance:none;width:18px;height:18px;border:1px solid var(--deep);border-radius:4px;margin:0;flex:none;background:none}
.chk:checked{background:var(--red);box-shadow:0 0 8px var(--red)}
.rest{color:var(--mute);border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:14px}
/* ring */
.ringbox{position:relative;width:150px;height:150px;margin:6px auto 0}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox .tr{stroke:#1d0a10}.ringbox .pg{stroke:var(--red);filter:drop-shadow(0 0 6px rgba(224,16,42,.7));transition:stroke-dasharray .6s}
.rin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.rin small{color:var(--mute);font-size:10px;text-align:center;max-width:104px;line-height:1.3}.rin .big{font-size:20px;letter-spacing:.04em}.rin .pc{color:var(--red);font-size:10px}
.go.off{background:#120609;color:var(--mute);box-shadow:none;border:1px solid var(--line)}.clocks{display:flex;justify-content:center;gap:18px;color:var(--mute);margin-top:10px;font-size:13px}.clocks b{color:var(--ink);font-weight:400}
.go{display:block;margin:16px auto 0;background:var(--red);color:#fff;border:0;border-radius:12px;font:inherit;padding:12px 26px;box-shadow:0 0 18px rgba(224,16,42,.45)}
.card{border:1px solid var(--deep);border-radius:14px;padding:4px 14px 8px;margin-top:14px;background:var(--panel)}
.blk{border:1px solid var(--line);border-radius:14px;padding:10px 14px 4px;margin-top:12px;background:var(--panel)}
.blk.now{border-color:var(--red);box-shadow:0 0 14px rgba(224,16,42,.35)}
.blk.past{opacity:.45}.blk h3{margin:0;font-weight:400;font-size:15px}.blk h3 em{font-style:normal;color:var(--red);margin-right:8px;font-size:13px}
.blk p{margin:4px 0 6px;color:var(--mute);font-size:12px}
.blk .item{padding:8px 0}
.bar{height:3px;background:#1d0a10;border-radius:2px;margin:8px 0}.bar i{display:block;height:100%;background:var(--red);box-shadow:0 0 8px var(--red);width:0;transition:width .5s}
#rit{position:fixed;inset:0;z-index:40;background:#050203;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#rit.on{display:flex}#rit small{color:var(--mute)}#rit h2{font-size:22px;color:var(--ink);margin:0}#rit p{max-width:320px;margin:0;line-height:1.5}
#rit .row{display:flex;gap:10px}#rit .row button{background:var(--red);border:0;color:#fff;font:inherit;padding:10px 22px;border-radius:10px}#rit .row button.g{background:none;border:1px solid var(--line);color:var(--ink)}
.orb{width:110px;height:110px;border:2px solid var(--red);border-radius:50%;box-shadow:0 0 30px rgba(224,16,42,.6);transform:scale(.6)}
#rx{width:100%;max-width:340px;text-align:left}
.opt{display:block;width:100%;margin:6px 0;background:none;border:1px solid var(--deep);color:var(--ink);font:inherit;padding:11px;border-radius:10px;text-align:center}
.opt.sel{border-color:var(--red);box-shadow:0 0 12px rgba(224,16,42,.5);color:#fff}
#rn{user-select:none;-webkit-user-select:none;touch-action:none}#rn.hold{box-shadow:0 0 30px var(--red)}
/* tabs */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#050203;border-top:1px solid var(--deep);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;padding:18px 0 16px}
nav button.on{color:var(--red);text-shadow:0 0 12px rgba(224,16,42,.7);box-shadow:inset 0 2px 0 var(--red)}
</style>
</head>

 {t:"16:30",n:"Reset the space",d:"Leave the week behind you in order.",i:["Tidy room and desk","Laundry and Monday’s clothes","Plan the week: classes, CATs, deadlines"]},
 {t:"21:30",n:"Shutdown",d:"Recover like it’s part of the job.",i:["No charts, no trading content","Prep tomorrow’s clothes and water","Asleep by 22:30"]}
];
const TT={
 2:[["07:00–10:00","SIT384 Mgt Information System","Ms. Grace · Lab 4"],["10:00–13:00","SIT372 Simulation and Modeling","Mr. Mulinge · Comp Lab 4"],["13:00–16:00","SIT365 Software Metrics","Ms. Veronica · PF2L4"]],
 3:[["07:00–10:00","SIT327 Event-Driven Programming","Mr. George · LUBAN"],["13:00–16:00","SIT342 Human Comp Int.","Mr. Mwunda · ADB Lab"],["16:00–19:00","SIT328 OS Implementation","Mr. Kimeu · Luban Workshop"]],
 4:[["10:00–13:00","SIT373 Computer Networks","Ms. Veronicah · Lab 1"],["16:00–19:00","SIT394 Emerging Technologies","Mr. Kimeu · PF2L6"]]};
const CLASSES=TT;
const CATS=[["2026-11-24","Tue 24 Nov","08:00","SIT384: Mgt Information System","Ms. Grace · Lab 4"],["2026-11-25","Wed 25 Nov","Time TBC","SIT327: Event-Driven Programming","Mr. George · LUBAN"]];
const CAT={};CATS.forEach(c=>CAT[c[0]]=c[2]+" – "+c[3]);
const RULES=["never move a stop further away","no trades on weekends: rest and review","size down after a red week","log every trade, even the bad ones"];
const RSTEPS=[
 {h:"Define the circle",p:"Pick the where and the when. This desk, this hour. Inside it only one thing exists: the plan.",min:8},
 {h:"Seal it",p:"Cut the inputs. Phone silent, door closed. Hold the button to seal the circle.",hold:2.5,btn:"Hold to seal"},
 {h:"Take center",p:"Take one breath. Say it aloud: “With clarity, inside this space I decide what gets my attention and what doesn’t.”",min:10},
 {h:"Breathe",breath:true},
 {h:"Name the fear",p:"Say one sentence: “I’m afraid this one loses.” Then: “I can feel it and still follow the plan.”",min:10},
 {h:"Choose your guard",p:"Who stands at the border and holds the line?",guard:["My values","My intentions","My higher self","The picture of what I’m building"]},
 {h:"The vow",p:"Say it low and slow. The King does not chase. He waits at the zone. He decides at the close of the candle. His stop is his word. His target is his word. He has no impulse, only precision.",min:15},
 {h:"Guard the door",min:10},
 {h:"Read the checklist",p:"Out loud. Any box that isn’t ticked means no entry.",check:true},
 {h:"Candle out",p:"Blow it out. The ritual is over. The work starts.",min:5,btn:"Done"}
];

const $=s=>document.querySelector(s);
const NAMES=["sun","mon","tue","wed","thu","fri","sat"];
const MON=["january","february","march","april","may","june","july","august","september","october","november","december"];
const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const isWE=d=>d.getDay()===0||d.getDay()===6;
const now=new Date();
let view=new Date(now.getFullYear(),now.getMonth(),1),sel=new Date(now);

function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function listFor(d){return isWE(d)?WBLOCKS:BLOCKS}
function cid(d,bi,i){return "c:"+key(d)+":"+bi+":"+i}
function progress(d){let t=0,n=0;listFor(d).forEach((b,bi)=>b.i.forEach((x,i)=>{t++;if(get(cid(d,bi,i))==="1")n++}));return t?n/t:0}
function minsOf(t){const [h,m]=t.split(":");return +h*60+ +m}
function curIdx(d){const m=d.getHours()*60+d.getMinutes();let c=-1;listFor(d).forEach((b,bi)=>{if(minsOf(b.t)<=m)c=bi});return c}
function nextIdx(d){const m=d.getHours()*60+d.getMinutes();return listFor(d).findIndex(b=>minsOf(b.t)>m)}
function blocksHTML(d,live){
  const we=isWE(d),cu=live?curIdx(d):-2;let h="";
  listFor(d).forEach((b,bi)=>{
    h+=`<div class="blk ${bi<cu?"past":""} ${bi===cu?"now":""}" data-bi="${bi}"><h3><em>${b.t}</em>${b.n}</h3><p>${b.d}</p>`;
    b.i.forEach((x,i)=>{h+=`<label class="item"><input class="chk" type="checkbox" data-id="${cid(d,bi,i)}" ${get(cid(d,bi,i))==="1"?"checked":""}><span class="n">${x}</span></label>`});
    h+="</div>";
  });
  if(we)h+=`<div class="rest">weekend reset. the trading ritual, prep and plans are off. backtesting stays in.</div>`;
  return h;
}
function applyNow(){const cu=curIdx(new Date());document.querySelectorAll("#v-today .blk").forEach(el=>{const bi=+el.dataset.bi;el.classList.toggle("past",bi<cu);el.classList.toggle("now",bi===cu)})}
function dayHTML(d){
  const we=isWE(d),cl=TT[d.getDay()]||[],k=key(d);
  let h=`<h2>${NAMES[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()].slice(0,3)} // ${we?"rest day, no trading":"trade day"}</h2>`;
  if(CAT[k])h+=`<div class="item"><span class="t">cat</span><span class="n">${CAT[k]}</span></div>`;
  cl.forEach(c=>h+=`<div class="item"><span class="t">${c[0]}</span><span class="n">${c[1]}<i>${c[2]}</i></span></div>`);
  h+=`<h2>routine</h2>`+blocksHTML(d,false);
  return h;
}
function bindChecks(root){root.querySelectorAll(".chk").forEach(c=>c.onchange=()=>{put(c.dataset.id,c.checked?"1":"0");updMeter()})}
function nyTime(){return new Intl.DateTimeFormat("en-GB",{timeZone:"America/New_York",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date())}
function localTime(){const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
const C=2*Math.PI*112;
function renderToday(){
  const el=$("#v-today"),d=new Date(),cl=TT[d.getDay()]||[];
  let h=`<div class="ringbox"><svg viewBox="0 0 250 250"><circle class="tr" cx="125" cy="125" r="112" fill="none" stroke-width="10"/><circle class="pg" id="pg" cx="125" cy="125" r="112" fill="none" stroke-width="10" stroke-linecap="round" stroke-dasharray="0 ${C}"/></svg>
  <div class="rin"><small id="nx">next</small><span class="big" id="cd">00:00:00</span><span class="pc" id="pc">0% done today</span></div></div>
  <div class="clocks"><span>Nairobi <b id="ck1"></b></span><span>New York <b id="ck2"></b></span></div>`;
  if(!isWE(d))h+=`<button class="go" id="start">Start the ritual</button>`;
  const up=CATS.filter(c=>c[0]>=key(d));if(up.length)h+=`<div class="card"><h2>Upcoming CATs</h2>`+up.map(c=>`<div class="item"><span class="t">${c[1]}<br>${c[2]}</span><span class="n">${c[3]}<i>${c[4]}</i></span></div>`).join("")+`</div>`;
  h+=`<div class="card"><h2>Classes today</h2>`+(cl.length?cl.map(c=>`<div class="item"><span class="t">${c[0]}</span><span class="n">${c[1]}<i>${c[2]}</i></span></div>`).join(""):`<div class="item"><span class="n" style="color:var(--mute)">No classes today.</span></div>`)+`</div>`;
  h+=blocksHTML(d,true);
  el.innerHTML=h;bindChecks(el);
  const st=$("#start");if(st)st.onclick=()=>startRitual(false);const pv=$("#prev2");if(pv)pv.onclick=()=>startRitual(true);
  tick();updMeter();
}
function updMeter(){const d=new Date(),p=progress(d),pg=$("#pg");if(!pg)return;pg.setAttribute("stroke-dasharray",(C*p)+" "+C);$("#pc").textContent=Math.round(p*100)+"% done today";const bar=$("#bar");if(bar)bar.style.width=Math.round(p*100)+"%"}
function tick(){
  const d=new Date();if(!$("#cd"))return;
  $("#ck1").textContent=localTime();$("#ck2").textContent=nyTime();
  const i=nextIdx(d),L=listFor(d);let target,label;
  if(i>=0){const m=minsOf(L[i].t);target=new Date(d);target.setHours(Math.floor(m/60),m%60,0,0);label="Next: "+L[i].n+" · "+L[i].t}
  else{const nd=new Date(d);nd.setDate(nd.getDate()+1);const f=listFor(nd)[0],m=minsOf(f.t);target=new Date(nd);target.setHours(Math.floor(m/60),m%60,0,0);label="Next: "+f.n+" · "+f.t+" tomorrow"}
  const sec=Math.max(0,Math.round((target-d)/1000)),p=n=>String(n).padStart(2,"0");
  $("#cd").textContent=p(Math.floor(sec/3600))+":"+p(Math.floor(sec%3600/60))+":"+p(sec%60);
  $("#nx").textContent=label;applyNow();
}
setInterval(tick,1000);
// ritual (strict: no skipping, timed steps, hold to seal, checklist must be ticked)
let rstep=0,rtimer=null,rcd=null,holdT=null,guard="";
let prevMode=false;function startRitual(pv){prevMode=pv===true;rstep=0;guard="";$("#rit").classList.add("on");showStep()}
function stopRitual(){clearTimeout(rtimer);clearInterval(rcd);clearTimeout(holdT);$("#rit").classList.remove("on");$("#rc").textContent="Leave";$("#rc").dataset.arm="0"}
function gate(ok){const b=$("#rn");b.disabled=!ok;b.style.opacity=ok?1:.35}
function finishRitual(){const d=new Date();if(!prevMode)BLOCKS[5].i.forEach((x,i)=>put(cid(d,5,i),"1"));stopRitual();renderToday()}
function showStep(){
  clearTimeout(rtimer);clearInterval(rcd);
  const s=RSTEPS[rstep],orb=$("#orb"),rx=$("#rx"),rn=$("#rn"),d=new Date();
  $("#rs").textContent="Step "+(rstep+1)+" of "+RSTEPS.length;$("#rh").textContent=s.h;rx.innerHTML="";orb.style.display="none";
  let p=s.p||"";
  if(s.h==="Guard the door")p=guard+" stands at the edge of the circle. When a worry, an urge to check your phone or a random memory pulls at you, don’t chase it. Notice it and send it back.";
  $("#rp").textContent=p;
  const base=s.btn||(rstep===RSTEPS.length-1?"Done":"Next");rn.textContent=base;
  if(s.breath){gate(false);rn.textContent="Breathe";breathe(1,true);return}
  if(s.hold){gate(true);return}
  if(s.guard){gate(false);s.guard.forEach(g=>{const b=document.createElement("button");b.className="opt";b.textContent=g;b.onclick=()=>{guard=g;rx.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o===b));gate(true)};rx.appendChild(b)});return}
  if(s.check){
    rx.innerHTML=BLOCKS[4].i.map((x,i)=>`<label class="item"><input class="chk" type="checkbox" data-i="${i}" ${get(cid(d,4,i))==="1"?"checked":""}><span class="n">${x}</span></label>`).join("");
    const ev=()=>{const all=[...rx.querySelectorAll(".chk")].every(c=>c.checked);gate(all)};
    rx.querySelectorAll(".chk").forEach(c=>c.onchange=()=>{put(cid(d,4,+c.dataset.i),c.checked?"1":"0");ev()});ev();return;
  }
  let t=s.min||5;gate(false);rn.textContent=base+" ("+t+")";
  rcd=setInterval(()=>{t--;if(t<=0){clearInterval(rcd);rn.textContent=base;gate(true)}else rn.textContent=base+" ("+t+")"},1000);
}
function breathe(r,inh){
  const orb=$("#orb");orb.style.display="block";
  if(r>10){rstep++;showStep();return}
  const sec=inh?4:6;$("#rp").textContent="Round "+r+" of 10: "+(inh?"in for 4":"out for 6");
  orb.style.transition="transform "+sec+"s ease-in-out";orb.style.transform=inh?"scale(1.25)":"scale(.6)";
  rtimer=setTimeout(()=>inh?breathe(r,false):breathe(r+1,true),sec*1000);
}
const rnb=$("#rn");
rnb.oncontextmenu=e=>e.preventDefault();
rnb.onpointerdown=()=>{const s=RSTEPS[rstep];if(!s.hold)return;rnb.textContent="Sealing…";rnb.classList.add("hold");holdT=setTimeout(()=>{rnb.classList.remove("hold");rstep++;showStep()},s.hold*1000)};
const rel=()=>{const s=RSTEPS[rstep];if(s&&s.hold){clearTimeout(holdT);rnb.classList.remove("hold");rnb.textContent=s.btn}};
rnb.onpointerup=rel;rnb.onpointerleave=rel;rnb.onpointercancel=rel;
rnb.onclick=()=>{const s=RSTEPS[rstep];if(s.hold||rnb.disabled)return;if(rstep>=RSTEPS.length-1){finishRitual();return}rstep++;showStep()};
$("#rc").onclick=()=>{const c=$("#rc");if(c.dataset.arm==="1"){stopRitual();return}c.dataset.arm="1";c.textContent="Tap again: the ritual won’t count";setTimeout(()=>{c.dataset.arm="0";c.textContent="Leave"},3000)};
function renderCal(){
  $("#mname").textContent=MON[view.getMonth()]+" "+view.getFullYear();
  $("#dow").innerHTML=["s","m","t","w","t","f","s"].map(x=>`<div class="dow">${x}</div>`).join("");
  const first=new Date(view.getFullYear(),view.getMonth(),1),n=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  let h="";for(let i=0;i<first.getDay();i++)h+="<div></div>";
  for(let i=1;i<=n;i++){
    const d=new Date(view.getFullYear(),view.getMonth(),i),k=key(d);
    let dots=CLASSES[d.getDay()]?'<i class="dot"></i>':'';
    if(CAT[k])dots='<i class="dot cat"></i>';
    if(isWE(d))dots='<i class="dot rt"></i>';
    h+=`<button class="d ${isWE(d)?"we":""} ${key(d)===key(now)?"today":""} ${key(d)===key(sel)?"sel":""}" data-d="${k}">${i}<span class="dots">${dots}</span></button>`;
  }
  $("#cells").innerHTML=h;
  document.querySelectorAll(".d").forEach(b=>b.onclick=()=>{const [y,m,dd]=b.dataset.d.split("-");sel=new Date(+y,+m-1,+dd);renderCal()});
  const dd=$("#dayDetail");dd.innerHTML=dayHTML(sel);bindChecks(dd);
}
function renderClasses(){
  let h="";[2,3,4].forEach(w=>{h+=`<h2>${["","","tuesday","wednesday","thursday"][w]}</h2>`;TT[w].forEach(c=>h+=`<div class="item"><span class="t">${c[0]}</span><span class="n">${c[1]}<i>${c[2]}</i></span></div>`)});
  $("#v-classes").innerHTML=h;
}
function renderRules(){$("#v-rules").innerHTML=`<h2>rules</h2>`+RULES.map(x=>`<div class="item"><span class="n">${x}</span></div>`).join("")}

$("#prev").onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};
$("#next").onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+b.dataset.t));
  $("#tabTitle").textContent=b.dataset.t.toUpperCase();
});
$("#hdate").textContent=NAMES[now.getDay()]+" "+now.getDate()+" "+MON[now.getMonth()].slice(0,3)+(isWE(now)?" // rest day":" // trade day");
renderToday();renderCal();renderClasses();
const intro=$("#intro");const close=()=>{intro.classList.add("out");document.body.classList.add("ready")};
intro.onclick=close;setTimeout(close,8000);
</script>
